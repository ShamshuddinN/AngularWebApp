<h1>Form 1</h1>
<div class="grid grid-cols-24 py-3 ">
    <div class="col-start-3 col-span-20 bg-green-50 flex justify-center ">
        <form [formGroup]="dateForm" (ngSubmit)="onSubmit()" class="min-h-50 max-h-50 min-w-55 max-w-55"  >
            <label for="form1"> Name </label>
            <input
          id="monthj"
          type="text"
          formControlName="month"
          maxlength="2"
          placeholder="e.g., 03 for March"
          class="px-4 py-1.5 border-2 border-gray-500 outline-0 rounded-md"
          [ngClass]="{ 'border-red-500': f['month'].invalid && f['month'].touched }"
        />

                <div *ngIf="f['month'].invalid && f['month'].touched" class="text-red-500 text-xs mt-1">
          <div *ngIf="f['month'].errors?.['required']">Month is required.</div>
          <div *ngIf="f['month'].errors?.['pattern']">Month must be in MM format (01-12).</div>
        </div>


        <input
          id="year5"
          type="text"
          formControlName="year"
          maxlength="4"
          placeholder="e.g., 2025"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          [ngClass]="{ 'border-red-500': f['year'].invalid && f['year'].touched }"
        />

        <div *ngIf="f['year'].invalid && f['year'].touched" class="text-red-500 text-xs mt-1">
          <div *ngIf="f['year'].errors?.['required']">Year is required.</div>
          <div *ngIf="f['year'].errors?.['pattern']">Year must be in YYYY format.</div>
        </div>

        <p>Cross field validation</p>
        <div *ngIf="dateForm.errors?.['pastDate'] && (f['month'].touched || f['year'].touched)" class="text-red-500 text-sm mt-2 text-center p-2 rounded-md bg-red-50 border border-red-200">
        The selected month and year must be current or in the future.
      </div>




      
      <div *ngIf="dateForm.errors?.['invalidMonthYearFormat'] && (f['month'].touched || f['year'].touched)" class="text-red-500 text-sm mt-2 text-center p-2 rounded-md bg-red-50 border border-red-200">
        Please enter valid numeric values for month and year.
      </div>

<div>
        <button
          type="submit"
          class="mt-3 bg-blue-300 hover:bg-blue-400 transition-colors duration-300 px-3 py-1.5 rounded-md"
          [disabled]="dateForm.invalid"
          [ngClass]="{ 'opacity-50 cursor-not-allowed': dateForm.invalid }"
        >
          Validate Date
        </button>
      </div>

              <span routerLink="form-a" routerLinkActive="active" ariaCurrentWhenActive="page" class=" mx-1.5 my-1.5 px-3 py-1.5 cursor-pointer bg-blue-300 rounded-md hover:bg-blue-400 transition-colors duration-300 " > Form1 </span>
              <span routerLink="form-b" routerLinkActive="active" ariaCurrentWhenActive="page" class=" mx-1.5 my-1.5 px-3 py-1.5 cursor-pointer bg-blue-300 rounded-md hover:bg-blue-400 transition-colors duration-300 " > Form2 </span>
        </form>
    </div>
</div>
<p>This is from unhidden</p>
<app-form11  [mymsg]="parentMessage" [name]="parentUserName" ></app-form11>
